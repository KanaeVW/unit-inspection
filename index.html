<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แบบตรวจสุขภาพห้องชุด</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6f8;--card:#fff;--tx:#1d2733;--mute:#5d6b7a;--line:#d5dce3;--ok:#1b8a4b;--bad:#c62f2f;--chg:#c97a0a;--accent:#1f5fae;--surf:#e8edf2;--water:#3b9ae1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12171c;--card:#1c242c;--tx:#e8edf2;--mute:#9aa8b6;--line:#34404c;--ok:#4cc27c;--bad:#ef6a6a;--chg:#e8a23a;--accent:#6aa8f0;--surf:#2a343e;--water:#5ab4f5}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12171c;--card:#1c242c;--tx:#e8edf2;--mute:#9aa8b6;--line:#34404c;--ok:#4cc27c;--bad:#ef6a6a;--chg:#e8a23a;--accent:#6aa8f0;--surf:#2a343e;--water:#5ab4f5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Sarabun","Noto Sans Thai","Noto Sans SC",system-ui,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:22px;margin:8px 0 4px}
.lang{display:flex;gap:6px}
.lang button{padding:6px 12px;font-weight:700}
.lang button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.sub{color:var(--mute);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
label.f{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
input[type=text],input[type=date],input[type=time]{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.item h2,.card h2{font-size:18px;margin:0 0 2px}
.item .d{color:var(--mute);font-size:14px;margin:0 0 10px}
.ex{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.ex figure{margin:0;border-radius:10px;padding:6px;text-align:center;border:2px solid}
.ex .g{border-color:var(--ok)}.ex .b{border-color:var(--bad)}
.ex svg{width:100%;height:auto;display:block;background:var(--surf);border-radius:6px}
.ex figcaption{font-size:13px;margin-top:4px}
.ex .g figcaption b{color:var(--ok)}.ex .b figcaption b{color:var(--bad)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts label{display:block;text-align:center;padding:12px 4px;border:2px solid var(--line);border-radius:10px;font-weight:700;cursor:pointer;user-select:none}
.opts input:focus-visible+label{outline:3px solid var(--accent)}
.opts .o1 input:checked+label{background:var(--ok);border-color:var(--ok);color:#fff}
.opts .o2 input:checked+label{background:var(--bad);border-color:var(--bad);color:#fff}
.opts .o3 input:checked+label{background:var(--chg);border-color:var(--chg);color:#fff}
.note{margin-top:8px}
.sum{display:flex;gap:10px;flex-wrap:wrap;font-weight:700}
.sum span{padding:6px 12px;border-radius:20px;background:var(--surf)}
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:620px){.sigs{grid-template-columns:1fr}}
canvas{width:100%;height:160px;border:2px dashed var(--line);border-radius:10px;background:#fff;touch-action:none;display:block}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
button{font:inherit;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--tx);cursor:pointer}
button.p{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
@media print{.btns,.ex,.lang{display:none}body{background:#fff}.card{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><h1>🏢 <span data-i="title"></span></h1>
<div class="lang"><button type="button" data-l="th">ไทย</button><button type="button" data-l="en">EN</button><button type="button" data-l="zh">中文</button></div></div>
<p class="sub" data-i="sub"></p>

<div class="card">
  <div class="grid">
    <div><label class="f" for="room" data-i="room"></label><input type="text" id="room" data-ph="roomph"></div>
    <div><label class="f" for="insp" data-i="insp"></label><input type="text" id="insp"></div>
    <div><label class="f" for="date" data-i="date"></label><input type="date" id="date"></div>
    <div><label class="f" for="time" data-i="time"></label><input type="time" id="time"></div>
  </div>
  <div class="btns"><button type="button" id="now" data-i="now"></button></div>
</div>

<div id="items"></div>

<div class="card">
  <h2 data-i="sumt"></h2>
  <div class="sum"><span style="color:var(--ok)"><i data-i="ok"></i> <b id="c1">0</b></span><span style="color:var(--bad)"><i data-i="no"></i> <b id="c2">0</b></span><span style="color:var(--chg)"><i data-i="chg"></i> <b id="c3">0</b></span><span><i data-i="un"></i> <b id="c0">6</b></span></div>
</div>

<div class="card">
  <h2 data-i="sigt"></h2>
  <p class="sub" style="margin:2px 0 10px" data-i="sigh"></p>
  <div class="sigs">
    <div><label class="f" data-i="s1"></label><canvas id="sig1"></canvas>
      <div class="btns"><button type="button" data-clr="sig1" data-i="clr"></button></div>
      <label class="f" for="n1" style="margin-top:10px" data-i="pn"></label><input type="text" id="n1"></div>
    <div><label class="f" data-i="s2"></label><canvas id="sig2"></canvas>
      <div class="btns"><button type="button" data-clr="sig2" data-i="clr"></button></div>
      <label class="f" for="n2" style="margin-top:10px" data-i="pn"></label><input type="text" id="n2"></div>
  </div>
</div>

<div class="btns"><button type="button" class="p" id="print" data-i="print"></button></div>
</div>

<script>
const L={
th:{title:'แบบตรวจสุขภาพห้องชุด',sub:'ติกเลือก ผ่าน / ไม่ผ่าน / เปลี่ยน ในแต่ละหัวข้อ โดยดูรูปตัวอย่างประกอบ',room:'เลขห้อง',roomph:'เช่น B1-0419',insp:'ชื่อผู้ตรวจ',date:'วันที่เข้าตรวจ',time:'เวลาที่เข้าตรวจ',now:'ใช้วันที่และเวลาปัจจุบัน',exg:'✓ ตัวอย่างที่ดี',exb:'✗ ตัวอย่างที่เสีย',ok:'ผ่าน',no:'ไม่ผ่าน',chg:'เปลี่ยน',un:'ยังไม่ติก',note:'หมายเหตุ (ถ้ามี)',sumt:'สรุปผล',sigt:'ลายเซ็น',sigh:'เซ็นชื่อในกรอบ (ใช้นิ้วหรือเมาส์)',s1:'ผู้ตรวจสอบ',s2:'ผู้พักอาศัย',clr:'ล้างลายเซ็น',pn:'ชื่อตัวบรรจง',print:'🖨️ พิมพ์ / บันทึกเป็น PDF',
items:[['1. หัวสโมค (เครื่องตรวจจับควัน)','ดูที่ไฟ LED ว่ามีไฟค้างติดตลอดเวลาหรือไม่','ไม่มีไฟ LED ค้าง','ไฟ LED ติดค้าง'],
['2. ก๊อกน้ำ (ซิงค์ล้างจาน)','เปิด-ปิดดู แล้วเช็กว่าปิดสนิท ไม่หยดซึม ไม่มีคราบสนิม','แห้ง ปิดสนิท','หยดซึม / มีคราบ'],
['3. สต๊อปวาล์ว (จุดต่อสายฉีดชำระ และสายเติมชักโครก)','ดูรอยต่อและลูกบิด ว่ามีน้ำซึม สนิม หรือบิดแล้วฝืดหรือไม่','รอยต่อแห้ง บิดได้ปกติ','น้ำซึม / เป็นสนิม'],
['4. สายน้ำดีใต้ซิงค์ล้างจาน','ดูตัวสายว่าบวม แตกลาย ถักขาด และดูข้อต่อว่ามีน้ำซึมหรือเป็นสนิมหรือไม่','สายเรียบ ข้อต่อแห้ง','สายบวม/แตก ข้อต่อซึม'],
['5. ก๊อกหลังห้อง','เปิด-ปิดดู แล้วเช็กน้ำหยดซึมที่ปากก๊อกและโคนก๊อก','แห้ง ปิดสนิท','หยดซึม / มีคราบ'],
['6. ก๊อกอ่างล้างหน้า','เปิด-ปิดดู แล้วเช็กน้ำหยดซึมที่ปากก๊อกและโคนก๊อก','แห้ง ปิดสนิท','หยดซึม / มีคราบ']]},
en:{title:'Unit Health Inspection Form',sub:'Tick Pass / Fail / Replace for each item, using the example pictures as a guide.',room:'Room No.',roomph:'e.g. B1-0419',insp:'Inspector name',date:'Inspection date',time:'Inspection time',now:'Use current date and time',exg:'✓ Good example',exb:'✗ Bad example',ok:'Pass',no:'Fail',chg:'Replace',un:'Not ticked',note:'Remarks (optional)',sumt:'Summary',sigt:'Signatures',sigh:'Sign inside the box (finger or mouse)',s1:'Inspector',s2:'Resident',clr:'Clear signature',pn:'Printed name',print:'🖨️ Print / Save as PDF',
items:[['1. Smoke detector','Check whether the LED light stays on constantly.','No stuck LED','LED stuck on'],
['2. Faucet (kitchen sink)','Open and close it; check it shuts off fully with no drips or rust stains.','Dry, shuts off fully','Dripping / stained'],
['3. Stop valve (joint between bidet hose and toilet fill hose)','Check the joint and knob for leaks, rust, or stiff turning.','Dry joint, turns normally','Leaking / rusty'],
['4. Water supply hose under kitchen sink','Check the hose for bulges, cracks, or broken braiding, and the fittings for leaks or rust.','Smooth hose, dry fittings','Bulging/cracked hose, leaking fitting'],
['5. Rear-of-unit faucet','Open and close it; check for drips at the spout and the base.','Dry, shuts off fully','Dripping / stained'],
['6. Bathroom basin faucet','Open and close it; check for drips at the spout and the base.','Dry, shuts off fully','Dripping / stained']]},
zh:{title:'房间健康检查表',sub:'请参照示例图片，为每个项目勾选 通过 / 不通过 / 更换。',room:'房号',roomph:'例如 B1-0419',insp:'检查人员姓名',date:'检查日期',time:'检查时间',now:'使用当前日期和时间',exg:'✓ 良好示例',exb:'✗ 故障示例',ok:'通过',no:'不通过',chg:'更换',un:'未勾选',note:'备注（可选）',sumt:'结果汇总',sigt:'签名',sigh:'请在框内签名（手指或鼠标）',s1:'检查人员',s2:'住户',clr:'清除签名',pn:'正楷姓名',print:'🖨️ 打印 / 保存为 PDF',
items:[['1. 烟雾探测器','查看 LED 指示灯是否一直亮着。','LED 未常亮','LED 常亮'],
['2. 水龙头（厨房水槽）','开关试试，检查是否能完全关紧，有无滴漏或锈迹。','干燥，关紧','滴漏 / 有污渍'],
['3. 角阀（喷枪软管与马桶进水软管的连接处）','检查接口和旋钮是否渗水、生锈，转动是否卡涩。','接口干燥，转动正常','渗水 / 生锈'],
['4. 厨房水槽下进水软管','检查软管有无鼓包、龟裂、编织层断裂，接头有无渗水或生锈。','软管平整，接头干燥','软管鼓包/破裂，接头渗水'],
['5. 房间后部水龙头','开关试试，检查出水口和根部有无滴漏。','干燥，关紧','滴漏 / 有污渍'],
['6. 洗手盆水龙头','开关试试，检查出水口和根部有无滴漏。','干燥，关紧','滴漏 / 有污渍']]}};
const S=(inner)=>`<svg viewBox="0 0 120 90" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
const drops=(x,y)=>`<path d="M${x} ${y}q-5 8 0 11q5-3 0-11z" fill="var(--water)"/><path d="M${x+10} ${y+16}q-4 6 0 9q4-3 0-9z" fill="var(--water)"/>`;
const art={
smoke:b=>S(`<rect x="0" y="0" width="120" height="10" fill="#9aa8b6"/><circle cx="60" cy="48" r="34" fill="#f2f2f2" stroke="#8a97a5" stroke-width="3"/><circle cx="60" cy="48" r="22" fill="none" stroke="#c4ccd4" stroke-width="2" stroke-dasharray="4 4"/>`+(b?`<circle cx="60" cy="48" r="13" fill="#e53935" opacity=".3"/><circle cx="60" cy="48" r="7" fill="#e53935"/><path d="M60 24v-8M82 48h8M38 48h-8M76 32l6-6M44 32l-6-6" stroke="#e53935" stroke-width="3" stroke-linecap="round"/>`:`<circle cx="60" cy="48" r="5" fill="#9aa5b0"/>`)),
faucet:b=>S(`<rect x="20" y="70" width="80" height="10" rx="3" fill="#8a97a5"/><rect x="30" y="38" width="16" height="32" fill="#b8c2cc" stroke="#6f7c89" stroke-width="2"/><rect x="22" y="30" width="32" height="9" rx="3" fill="#9aa8b6"/><path d="M38 38V24Q38 12 52 12H78Q90 12 90 24V34" fill="none" stroke="#b8c2cc" stroke-width="12" stroke-linecap="round"/><rect x="84" y="34" width="12" height="6" fill="#6f7c89"/>`+(b?drops(90,44)+`<path d="M32 58q4-3 8 0q-4 6-8 0z" fill="#b5651d" opacity=".7"/>`:``)),
valve:b=>S(`<rect x="0" y="40" width="40" height="14" fill="#b8c2cc" stroke="#6f7c89" stroke-width="2"/><rect x="80" y="40" width="40" height="14" fill="#b8c2cc" stroke="#6f7c89" stroke-width="2"/><rect x="40" y="32" width="40" height="30" rx="4" fill="#9aa8b6" stroke="#6f7c89" stroke-width="2"/><rect x="54" y="14" width="12" height="18" fill="#8a97a5"/><rect x="46" y="8" width="28" height="8" rx="3" fill="#d94b4b"/>`+(b?`<path d="M42 36q6 4 2 10q-6-2-2-10zM76 50q5 3 1 8q-5-2-1-8z" fill="#7a8f3a" opacity=".8"/>`+drops(42,64)+drops(70,66):``)),
hose:b=>S(`<rect x="8" y="14" width="16" height="12" fill="#9aa8b6"/><rect x="96" y="60" width="16" height="12" fill="#9aa8b6"/><path d="M24 20Q60 20 60 45T96 66" fill="none" stroke="#7d8b99" stroke-width="10"/><path d="M24 20Q60 20 60 45T96 66" fill="none" stroke="#dfe5ea" stroke-width="6" stroke-dasharray="3 3"/>`+(b?`<path d="M54 30l8 6-6 6 8 6" fill="none" stroke="#c62f2f" stroke-width="3" stroke-linecap="round"/><circle cx="60" cy="40" r="9" fill="none" stroke="#c62f2f" stroke-width="2" stroke-dasharray="3 2"/>`+drops(62,56)+`<path d="M94 58l6 4" stroke="#b5651d" stroke-width="4"/>`:``))
};
const kinds=['smoke','faucet','valve','hose','faucet','faucet'];
const box=document.getElementById('items');
kinds.forEach((k,i)=>{const n='r'+i;
 box.insertAdjacentHTML('beforeend',`<section class="card item"><h2 data-it="${i}-0"></h2><p class="d" data-it="${i}-1"></p>
 <div class="ex"><figure class="g">${art[k](false)}<figcaption><b data-i="exg"></b><br><span data-it="${i}-2"></span></figcaption></figure>
 <figure class="b">${art[k](true)}<figcaption><b data-i="exb"></b><br><span data-it="${i}-3"></span></figcaption></figure></div>
 <div class="opts">
 <div class="o1"><input type="radio" name="${n}" id="${n}a" value="1"><label for="${n}a">✓ <span data-i="ok"></span></label></div>
 <div class="o2"><input type="radio" name="${n}" id="${n}b" value="2"><label for="${n}b">✗ <span data-i="no"></span></label></div>
 <div class="o3"><input type="radio" name="${n}" id="${n}c" value="3"><label for="${n}c">⟳ <span data-i="chg"></span></label></div></div>
 <div class="note"><input type="text" data-ph="note"></div></section>`)});
function setLang(l){const d=L[l];
 document.documentElement.lang=l;document.title=d.title;
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=d[e.dataset.i]);
 document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=d[e.dataset.ph]);
 document.querySelectorAll('[data-it]').forEach(e=>{const[a,b]=e.dataset.it.split('-');e.textContent=d.items[a][b]});
 document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
 try{localStorage.setItem('lang',l)}catch(e){}}
document.querySelector('.lang').addEventListener('click',e=>{const l=e.target.dataset.l;if(l)setLang(l)});
let start='th';try{start=localStorage.getItem('lang')||'th';if(!L[start])start='th'}catch(e){}
setLang(start);
function sum(){let c=[0,0,0,0];kinds.forEach((_,i)=>{const r=document.querySelector(`input[name=r${i}]:checked`);c[r?+r.value:0]++});
 for(let i=0;i<4;i++)document.getElementById('c'+i).textContent=c[i]}
box.addEventListener('change',sum);sum();
document.getElementById('now').onclick=()=>{const d=new Date(),p=x=>String(x).padStart(2,'0');
 document.getElementById('date').value=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
 document.getElementById('time').value=`${p(d.getHours())}:${p(d.getMinutes())}`};
function pad(id){const cv=document.getElementById(id),cx=cv.getContext('2d');let on=false;
 const r0=cv.getBoundingClientRect(),s=window.devicePixelRatio||1;cv.width=r0.width*s;cv.height=r0.height*s;cx.scale(s,s);cx.lineWidth=2.5;cx.lineCap='round';cx.strokeStyle='#111';
 const pt=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
 cv.addEventListener('pointerdown',e=>{on=true;cv.setPointerCapture(e.pointerId);const[x,y]=pt(e);cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+.1,y);cx.stroke()});
 cv.addEventListener('pointermove',e=>{if(!on)return;const[x,y]=pt(e);cx.lineTo(x,y);cx.stroke()});
 ['pointerup','pointercancel'].forEach(v=>cv.addEventListener(v,()=>on=false));
 document.querySelector(`[data-clr=${id}]`).onclick=()=>cx.clearRect(0,0,cv.width,cv.height)}
pad('sig1');pad('sig2');
document.getElementById('print').onclick=()=>window.print();
</script>
</body>
</html>
